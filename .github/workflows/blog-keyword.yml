name: 빠삭정책 키워드 텔레그램 알림

# 동작 방식
#  - Claude 예약 작업(매일 12:17)이 blog-keywords/latest.md 를 올리면 그 내용을 텔레그램으로 보낸다.
#  - 보내는 봇: 네이버 블로그 dot_liner 봇 (비밀값 BLOG_TELEGRAM_BOT_TOKEN, BLOG_TELEGRAM_CHAT_ID)
#    두 비밀값이 아직 없으면 엠팍 알림봇(TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID)으로 대신 보낸다.
#  - Actions 탭에서 직접 실행(workflow_dispatch)하면 입력한 문구를 보낸다. 비워 두면 latest.md를 보낸다.

on:
  push:
    branches: [main]
    paths: ["blog-keywords/latest.md"]
  workflow_dispatch:
    inputs:
      text:
        description: "보낼 문구 (비우면 latest.md)"
        required: false

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BLOG_TOKEN: ${{ secrets.BLOG_TELEGRAM_BOT_TOKEN }}
      BLOG_CHAT: ${{ secrets.BLOG_TELEGRAM_CHAT_ID }}
      MLB_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      MLB_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
      INPUT_TEXT: ${{ github.event.inputs.text }}
    steps:
      - uses: actions/checkout@v4

      - name: 텔레그램 전송
        run: |
          python3 - <<'EOF'
          import json, os, sys, urllib.error, urllib.parse, urllib.request

          text = (os.environ.get("INPUT_TEXT") or "").strip()
          if not text:
              with open("blog-keywords/latest.md", encoding="utf-8") as f:
                  text = f.read().strip()
          if not text:
              sys.exit("보낼 내용이 비어 있음")

          if os.environ.get("BLOG_TOKEN") and os.environ.get("BLOG_CHAT"):
              token, chat, who = os.environ["BLOG_TOKEN"], os.environ["BLOG_CHAT"], "dot_liner 봇"
          else:
              token, chat, who = os.environ["MLB_TOKEN"], os.environ["MLB_CHAT"], "엠팍 알림봇(대체)"

          # 텔레그램 한 메시지 최대 4096자 → 4000자 기준 줄 단위로 나눔
          chunks = []
          while text:
              if len(text) <= 4000:
                  chunks.append(text)
                  break
              cut = text.rfind("\n", 0, 4000)
              cut = cut if cut > 0 else 4000
              chunks.append(text[:cut])
              text = text[cut:].lstrip("\n")

          url = "https://api.telegram.org/bot" + token + "/sendMessage"
          for c in chunks:
              data = urllib.parse.urlencode({
                  "chat_id": chat,
                  "text": c,
                  "disable_web_page_preview": "true",
              }).encode()
              try:
                  with urllib.request.urlopen(url, data=data, timeout=30) as r:
                      res = json.load(r)
              except urllib.error.HTTPError as e:
                  try:
                      res = json.load(e)
                  except Exception:
                      res = {"ok": False, "description": f"HTTP {e.code}"}
              if not res.get("ok"):
                  print(f"::error::텔레그램 오류({who}): {res.get('description')}")
                  sys.exit(1)
          print(f"::notice::전송 완료({who}): {len(chunks)}개 메시지")
          EOF
